<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIP PHONE — Đăng ký thành công</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">VIP</span><span class="brand-name">PHONE</span></div>
    <span class="co-brand">VIP ORDER × BNI</span>
  </header>

  <main class="container narrow">
    <section class="card success-card">
      <div class="success-icon">✓</div>
      <p class="eyebrow">ĐĂNG KÝ THÀNH CÔNG</p>
      <h1>Giữ mã này để nhận quà</h1>

      <div id="giftDetails" class="gift-details"></div>

      <div class="gift-code-wrap">
        <span>Mã nhận quà</span>
        <strong id="giftCode">---</strong>
      </div>

      <div id="qr" class="qr-box" aria-label="QR nhận quà"></div>
      <p class="helper">Đưa mã hoặc QR này cho nhân viên VIP PHONE khi nhận sản phẩm.</p>

      <a class="secondary-btn" href="index.html">Đăng ký người khác</a>
    </section>
  </main>

  <script src="assets/js/qr-lite.js"></script>
  <script src="assets/js/success.js"></script>
</body>
</html>
