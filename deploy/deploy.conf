# =============================================================================
# CẤU HÌNH TRIỂN KHAI — VIP PHONE  (KHÔNG chứa secret, có trong Git)
# =============================================================================
# Giá trị riêng của từng máy trạm (đường dẫn khoá SSH, host do Owner cấp) đặt ở
# deploy/deploy.local.conf — file đó KHÔNG vào Git. Xem deploy.local.conf.example.
# =============================================================================

PROJECT=vipphone

# --- Gốc cài đặt trên máy chủ --------------------------------------------
# Brief gốc đề nghị /opt/vip/<project>. Ở đây dùng $HOME vì ĐO ĐƯỢC:
# user `deploy` trên host staging 160.22.170.20 KHÔNG có sudo
# (docs/MASTER_STATUS.md §31.1: "not in the sudoers file"), nên nó không ghi
# được vào /opt. Cấu trúc releases/current/shared/backups giữ nguyên.
# Máy chủ nào có sudo thì đặt lại APP_ROOT=/opt/vip/vipphone trong file local.
APP_ROOT='$HOME/vip/vipphone'

# Số bản phát hành giữ lại trên máy chủ (ngoài bản đang chạy).
KEEP_RELEASES=5

# --- Đường kiểm tra sức khoẻ ---------------------------------------------
HEALTH_PATH=/api/health
READY_PATH=/api/ready

# --- Cách chạy -----------------------------------------------------------
# docker  — build ảnh rồi chạy container (dùng khi user triển khai KHÔNG có sudo)
# systemd — cần sudo; chưa dùng cho dự án này
STAGING_RUNTIME=docker
PRODUCTION_RUNTIME=docker

# Cổng trên máy chủ mà container lắng nghe (reverse proxy trỏ vào đây).
STAGING_PORT=18080
PRODUCTION_PORT=18090

# Tên container/CSDL — tách hẳn hai môi trường, và tách khỏi dự án khác đang
# dùng chung host (vip-viettelpost).
STAGING_PG_CONTAINER=vipphone-staging-pg
STAGING_PG_DB=vipphone_staging
STAGING_PG_USER=vipphone
STAGING_NETWORK=vipphone-staging-net

PRODUCTION_PG_CONTAINER=vipphone-prod-pg
PRODUCTION_PG_DB=vipphone_prod
PRODUCTION_PG_USER=vipphone
PRODUCTION_NETWORK=vipphone-prod-net

# --- Host: CỐ Ý ĐỂ TRỐNG -------------------------------------------------
# Để trống nghĩa là chưa đo được, và mọi script sẽ DỪNG thay vì đoán. Không
# bao giờ điền giá trị phỏng đoán vào đây.
STAGING_HOST=
STAGING_USER=
STAGING_SSH_KEY=
STAGING_URL=

PRODUCTION_HOST=
PRODUCTION_USER=
PRODUCTION_SSH_KEY=
PRODUCTION_URL=

# --- Kiểm tra tại máy trước khi triển khai -------------------------------
# Chạy THẬT, không bỏ qua. Thiếu venv thì staging.sh DỪNG chứ không âm thầm
# bỏ test — bỏ test là bỏ đúng thứ bước đó tồn tại để làm.
#
# ⚠️  ĐÃ ĐO (07/10/2026, Mac mini): tests/conftest.py nối PostgreSQL ở mức
#     session, nên MỌI test cần một PostgreSQL sống — kể cả test không đánh dấu
#     `integration`. Vì vậy phải đặt TEST_DATABASE_URL trước khi chạy, và tên
#     database PHẢI kết thúc bằng `_test` (chốt an toàn trong conftest.py).
#     Cách dựng cụm tạm: xem docs/DIRECT-DEPLOY.md §2.
#     Lượt đo: 418 passed · 1 skipped (ca docker, máy không có docker) · 11,83s.
LOCAL_TEST_CMDS=(
  '$PY -m ruff check app tests tests_e2e migrations'
  '$PY -m ruff format --check app tests tests_e2e migrations'
  '$PY -m pytest -q'
)
