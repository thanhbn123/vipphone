name: CI

on:
  # push KHÔNG còn chạy cho MỌI nhánh.
  #
  # Vì sao: với `push:` trần, một nhánh có PR mở sẽ chạy TRỌN BỘ CI HAI LẦN cho
  # cùng một commit (một lần event `push`, một lần event `pull_request`) — đo
  # được trên repo này. Giới hạn push vào develop/main giữ nguyên độ phủ (PR
  # vẫn chạy đủ) mà bỏ đúng phần trùng lặp.
  #
  # Từ 07/10/2026, GitHub Actions KHÔNG còn là cửa quyết định triển khai
  # (docs/DIRECT-DEPLOY.md). Nó vẫn là lưới an toàn cho mã vào develop/main.
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  PYTHON_VERSION: "3.12"
  #: Database dùng cho integration test (service container bên dưới).
  #:
  #: ⚠️  CỐ Ý ĐỂ PASSWORD TRONG URL. Đừng "dọn dẹp" thành `trust` không mật
  #: khẩu: chính việc URL CÓ password mới làm lộ nhóm lỗi mà máy local không
  #: thấy. Đã dính một lần — `str(URL)` của SQLAlchemy che password thành
  #: `***` nên 7 test migration pass ở máy mà FAIL trên CI. Giữ password lại
  #: chính là giữ phép đo phủ đúng ca đó. Xem docs/MASTER_STATUS.md §17.
  TEST_DATABASE_URL: "postgresql+psycopg://vipphone:vipphone@localhost:5432/vipphone_test"

jobs:
  # ---------------------------------------------------------------------
  # Secret scan — gitleaks thật, quét TOÀN BỘ lịch sử git.
  #
  # Bản baseline cũ dùng `grep -RInE '<mẫu>' .` với mẫu nằm ngay trong file
  # workflow nên nó khớp chính nó, làm CI đỏ 2/2 run. Xem MASTER_STATUS §1.1.
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan git history for secrets
        run: ./gitleaks git --no-banner --redact --exit-code 1

  # ---------------------------------------------------------------------
  # Kiểm tra tĩnh frontend + chốt chặn chống thoái hoá.
  # ---------------------------------------------------------------------
  validate-static:
    name: Validate static frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files exist
        run: |
          set -euo pipefail
          for f in \
            index.html success.html redeem.html admin-leads.html \
            shop.html product.html \
            assets/css/styles.css \
            assets/js/config.js assets/js/tracking.js assets/js/util.js \
            assets/js/qr.js assets/js/app.js assets/js/success.js \
            assets/js/redeem.js assets/js/qr-scan.js assets/js/admin-leads.js \
            assets/js/turnstile.js \
            assets/js/shop.js assets/js/product.js assets/js/reco.js \
            assets/js/cart-store.js assets/js/cart.js assets/js/checkout.js assets/js/order-success.js \
            cart.html checkout.html order-success.html admin-commerce.html assets/js/admin-commerce.js \
            app/routers/public_config.py \
            tests/test_turnstile.py tests/test_auth_boundary.py \
            data/iphone-models.json \
            app/main.py app/config.py app/models.py \
            app/routers/admin.py app/services/admin_leads.py \
            app/routers/products.py app/routers/admin_products.py \
            app/services/catalog.py \
            alembic.ini Makefile pytest.ini .env.example \
            migrations/versions/0001_initial.py \
            migrations/versions/0007_product_catalog.py \
            migrations/versions/0008_recommendation_priority.py \
            migrations/versions/0009_cart_order.py docs/commerce.md \
            migrations/versions/0010_payments.py docs/payments.md app/payments/providers.py \
            migrations/versions/0011_inventory.py docs/inventory.md \
            migrations/versions/0012_price_history.py docs/price-history.md \
            migrations/versions/0013_product_images.py docs/product-images.md app/storage.py \
            migrations/versions/0014_order_attribution.py docs/attribution.md \
            app/logredact.py scripts/restore_drill.py scripts/staging_commerce_smoke.py \
            docs/OWNER_ACCEPTANCE_COMMERCE.md docs/STAGING_RUNBOOK_COMMERCE.md \
            scripts/staging_browser_check.py \
            docs/MASTER_STATUS.md docs/architecture.md docs/lead-schema.md \
            docs/catalog.md \
            docs/adr/0001-stack-selection.md \
            docs/staging.md docs/pii-data-map.md docs/OWNER_DECISIONS_REQUIRED.md \
            docs/decisions/PII_RETENTION_OPTIONS.md \
            .env.staging.example scripts/enable_branch_protection.sh \
            scripts/staging_preflight.sh scripts/staging_preflight.py \
            scripts/load_smoke.py scripts/cleanup_test_data.py scripts/staging_acceptance.sh \
            scripts/staging_backup.sh docs/staging-domain-tls.md \
            docs/backup-restore.md docs/STAGING_ACCEPTANCE.md \
            requirements.txt requirements-dev.txt \
            README.md
          do
            test -f "$f" || { echo "THIẾU FILE: $f"; exit 1; }
          done

      - name: Validate every JSON file
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.json' -type f -print | while read -r f; do
            echo "JSON OK: $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          for f in assets/js/*.js; do
            echo "JS OK: $f"
            node --check "$f"
          done

      # G14/V8: `Number("250000.10")` + `Intl.NumberFormat("vi-VN")` từng in ra
      # `250.000,1 đ` — mất chữ số 0 cuối, tức là hiển thị SAI giá đã lưu. Chốt này
      # require() đúng tệp đang phục vụ khách, không chép lại logic.
      - name: Guard — tiền hiển thị phải khớp tiền đã lưu
        run: node scripts/kiem-tien-hien-thi.js

      - name: Guard — không được có lại QR giả
        run: |
          set -euo pipefail
          if [ -f assets/js/qr-lite.js ]; then
            echo "LỖI: assets/js/qr-lite.js (QR giả) đã quay lại. Xem docs/MASTER_STATUS.md §1.6."
            exit 1
          fi
          if grep -rn 'drawQrLike' --include='*.js' --include='*.html' . ; then
            echo "LỖI: còn tham chiếu tới drawQrLike (QR giả)."
            exit 1
          fi

      - name: Guard — QR phải lấy từ server
        run: |
          set -euo pipefail
          grep -q '/qr.png' assets/js/qr.js || {
            echo "LỖI: assets/js/qr.js phải lấy ảnh QR từ /api/gifts/{code}/qr.png."
            exit 1
          }
          if grep -q 'NOT_IMPLEMENTED' assets/js/qr.js; then
            echo "LỖI: QR vẫn đang ở trạng thái NOT_IMPLEMENTED."
            exit 1
          fi

      - name: Guard — frontend KHÔNG được quay lại lưu lead ở localStorage
        run: |
          set -euo pipefail

          # Khoá lưu lead của bản client-only cũ: không được xuất hiện lại ở đâu.
          if grep -rn 'vipphone_leads_v1' --include='*.js' --include='*.html' . ; then
            echo "LỖI: frontend lại lưu lead vào localStorage. Server là nguồn chân lý duy nhất."
            exit 1
          fi

          # app.js không được GỌI localStorage.
          #
          # Ghi chú: mẫu phải bám vào LỜI GỌI (`localStorage.`), không phải chữ
          # "localStorage" trần — vì trong app.js có CÂU VĂN giải thích rằng nó
          # không dùng localStorage. Mẫu trần sẽ khớp chính câu giải thích đó,
          # tức là bước kiểm chứng lại tự khớp chính nó (xem MASTER_STATUS §17).
          if grep -nE 'localStorage[[:space:]]*\.' assets/js/app.js ; then
            echo "LỖI: assets/js/app.js không được gọi localStorage."
            exit 1
          fi

          # Khoá nhân viên: CHỈ sessionStorage. Ghi vào localStorage là để khoá
          # nằm lại trên máy cho người kế tiếp mở máy đó — khoá sống lâu hơn
          # phiên làm việc. Chốt này phủ cả hai trang dùng khoá.
          for f in assets/js/redeem.js assets/js/admin-leads.js; do
            if grep -nE 'localStorage[[:space:]]*\.' "$f" ; then
              echo "LỖI: $f ghi khoá nhân viên vào localStorage. Chỉ dùng sessionStorage."
              exit 1
            fi
          done

          # Đối chứng dương: mẫu trên PHẢI bắt được một lời gọi thật.
          # Nếu bước này không bắt được, chốt chặn đang vô dụng và phải sửa.
          probe="$(mktemp)"
          printf '%s\n' 'localStorage.setItem("x", "y");' > "$probe"
          if ! grep -qE 'localStorage[[:space:]]*\.' "$probe"; then
            echo "LỖI: chốt chặn localStorage không hoạt động (đối chứng dương thất bại)."
            rm -f "$probe"
            exit 1
          fi
          rm -f "$probe"
          echo "Chốt chặn localStorage: đạt, và đã kiểm bằng đối chứng dương."

      - name: Guard — HTML không dùng inline script/style/handler (CSP nghiêm)
        run: |
          set -euo pipefail
          for f in index.html success.html redeem.html admin-leads.html shop.html product.html; do
            grep -q '<html lang="vi"' "$f" || { echo "LỖI: $f thiếu lang=\"vi\""; exit 1; }
            grep -q 'name="viewport"' "$f" || { echo "LỖI: $f thiếu viewport"; exit 1; }
            if grep -nE '\son(click|submit|change|input|load|error)=' "$f"; then
              echo "LỖI: $f dùng inline event handler — chuyển sang addEventListener."
              exit 1
            fi
            if grep -nE '<script[^>]*>[^<]' "$f"; then
              echo "LỖI: $f có script nội tuyến; CSP nghiêm (script-src 'self') sẽ chặn."
              exit 1
            fi
            if grep -nE 'style="' "$f"; then
              echo "LỖI: $f có style nội tuyến; CSP nghiêm (style-src 'self') sẽ chặn."
              exit 1
            fi
          done

      - name: Guard — khoá SECRET Turnstile không được lộ phía client
        run: |
          set -euo pipefail
          # Khoá site là công khai; khoá SECRET thì tuyệt đối không được có trong
          # bất kỳ tệp nào trình duyệt tải về. Lộ secret = kẻ tấn công tự giải
          # được challenge, tức là bot protection vô hiệu.
          if grep -rIn 'TURNSTILE_SECRET_KEY\|turnstile_secret' assets/ *.html 2>/dev/null; then
            echo "LỖI: khoá secret Turnstile xuất hiện phía client."
            exit 1
          fi

          # Đối chứng dương: mẫu PHẢI bắt được một chuỗi thật, nếu không chốt chặn
          # này đang vô dụng mà vẫn xanh.
          probe="$(mktemp)"
          printf '%s\n' "const k = 'TURNSTILE_SECRET_KEY';" > "$probe"
          if ! grep -q 'TURNSTILE_SECRET_KEY' "$probe"; then
            echo "LỖI: chốt chặn secret Turnstile không hoạt động (đối chứng dương thất bại)."
            rm -f "$probe"; exit 1
          fi
          rm -f "$probe"
          echo "OK: không có khoá secret Turnstile phía client."

      - name: Guard — không có secret dạng phổ biến trong file nguồn
        run: |
          set -euo pipefail
          # Mẫu ghép từ nhiều mảnh để CHÍNH FILE NÀY không chứa chuỗi hoàn chỉnh.
          PAT1='ghp''_[A-Za-z0-9]{20,}'
          PAT2='github''_pat_[A-Za-z0-9_]{20,}'
          PAT3='sk''-[A-Za-z0-9]{20,}'
          if grep -RInE "${PAT1}|${PAT2}|${PAT3}" \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv . ; then
            echo "LỖI: phát hiện chuỗi giống secret."
            exit 1
          fi
          echo "Không phát hiện secret dạng phổ biến."

  # ---------------------------------------------------------------------
  # Backend: lint + migration + unit test + integration test trên PostgreSQL 16.
  #
  # CỐ Ý dùng PostgreSQL THẬT, không dùng SQLite: chính sách chống trùng dựa
  # trên UNIQUE INDEX MỘT PHẦN, và redeem dựa trên khoá hàng — SQLite không có
  # những thứ đó, nên test sẽ nói dối về hành vi thật.
  # ---------------------------------------------------------------------
  backend:
    name: Backend (lint, migration, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vipphone
          POSTGRES_PASSWORD: vipphone
          POSTGRES_DB: vipphone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vipphone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          set -euo pipefail
          ruff check app tests tests_e2e migrations scripts
          ruff format --check app tests tests_e2e migrations scripts

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U vipphone; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL không sẵn sàng"; exit 1

      - name: Migration applies cleanly on a fresh database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic current
          alembic check

      - name: Guard — cài CHỈ requirements.txt rồi import ứng dụng
        # VÌ SAO CẦN: CI cài requirements-dev.txt (gồm cả httpx), nên một phụ thuộc
        # CHẠY THẬT bị khai thiếu trong requirements.txt sẽ KHÔNG làm CI đỏ — nhưng
        # làm ứng dụng crash ngay khi khởi động ở production. Đã xảy ra thật: xem STG-1
        # (app/security.py import httpx, httpx chỉ có trong dev).
        # Chốt này cài ĐÚNG thứ production cài, rồi import app.
        run: |
          set -euo pipefail
          python -m venv /tmp/runtime-only
          /tmp/runtime-only/bin/pip install -q --upgrade pip
          /tmp/runtime-only/bin/pip install -q -r requirements.txt
          /tmp/runtime-only/bin/python -c "import app.main; print('OK: import app.main chỉ với runtime deps')"

      - name: Unit tests
        run: python -m pytest -q -m "not integration" --durations=5

      - name: Integration tests (PostgreSQL)
        run: python -m pytest -q -m integration --durations=10

      - name: Full test suite
        run: python -m pytest -q --durations=10

  # ---------------------------------------------------------------------
  # G10 — Quét lỗ hổng phụ thuộc.
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --strict --desc

      - name: Audit dev dependencies
        # Bộ dev gồm Playwright/ruff/pytest — không phải đường chạy production,
        # nhưng vẫn chạy trong CI nên vẫn phải soi.
        run: pip-audit -r requirements-dev.txt --strict --desc

  # ---------------------------------------------------------------------
  # G10 — E2E trình duyệt THẬT.
  #
  # VÌ SAO CẦN JOB NÀY: trước đây CI chỉ *lint* `tests_e2e` mà KHÔNG CHẠY nó
  # (pytest.ini đặt `testpaths = tests`). Nghĩa là bộ E2E hỏng vẫn qua CI —
  # đúng dạng "báo PASS trong khi test không chạy".
  #
  # Cố ý dùng PostgreSQL service container: SQLite không có UNIQUE INDEX MỘT
  # PHẦN nên sẽ nói dối về chính sách chống trùng.
  # ---------------------------------------------------------------------
  e2e:
    # ---------------------------------------------------------------------
    # CHUYỂN SANG CHẠY TAY (07/10/2026) — đây là job tốn nhất của repo:
    # ba engine trình duyệt × (PostgreSQL service + tải Playwright browser).
    #
    # Nó KHÔNG bị xoá, và đường chạy không bị bỏ: `make test-e2e` chạy đúng bộ
    # đó tại máy, và bước nghiệm thu staging (deploy/verify.sh) đo trên bản
    # ĐANG CHẠY THẬT — thứ mà CI không bao giờ đo được.
    #
    # Chạy lại trên GitHub khi cần: tab Actions → CI → Run workflow.
    # Bật lại vĩnh viễn: xoá dòng `if:` ngay dưới đây.
    #
    # ⚠️  HỆ QUẢ PHẢI BIẾT: scripts/enable_branch_protection.sh liệt kê ba check
    #     `E2E (chromium|firefox|webkit)` là check bắt buộc. Ba check đó nay
    #     KHÔNG xuất hiện trên PR, nên bật branch protection với danh sách cũ
    #     sẽ làm PR chờ mãi một check không bao giờ tới. Xem §8 của
    #     docs/DIRECT-DEPLOY.md trước khi bật protection.
    # ---------------------------------------------------------------------
    if: github.event_name == 'workflow_dispatch'

    # Tên job chứa tên engine ⇒ GitHub sinh BA check riêng. Danh sách check bắt
    # buộc trong scripts/enable_branch_protection.sh PHẢI khớp cả ba, nếu không
    # Owner bật protection xong sẽ chờ mãi một check không bao giờ xuất hiện.
    name: E2E (${{ matrix.browser }} thật + PostgreSQL)
    runs-on: ubuntu-latest

    strategy:
      # Một engine hỏng KHÔNG được che kết quả của hai engine kia.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vipphone
          POSTGRES_PASSWORD: vipphone
          POSTGRES_DB: vipphone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vipphone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Bình thường 30-50 giây. Đã đo được 2 lần treo >10 phút ở `apt-get` của
      # `--with-deps` (07/10/2026, chưa chạy test nào). Trần thời gian để treo thì
      # FAIL NHANH và chạy lại được, thay vì giữ runner tới 6 giờ.
      - name: Install ${{ matrix.browser }}
        timeout-minutes: 8
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U vipphone; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL không sẵn sàng"; exit 1

      - name: Run E2E suite (${{ matrix.browser }})
        # KHÔNG truyền `-m` để loại trừ gì, và KHÔNG cho phép skip im lặng:
        # một bộ E2E bị skip là một bộ E2E không bao giờ có thể FAIL.
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: python -m pytest tests_e2e -q --durations=10

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
